name: fitness_christmas
description: Aplicación Fitness navideña con sensores Android, GPS y persistencia local.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sensors_plus: ^6.1.1
  pedometer: ^4.0.2
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  local_auth: ^2.3.0
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: ^0.19.0
  shared_preferences: ^2.5.6
  crypto: ^3.0.8

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/frostfit_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/frostfit_logo.png"
  adaptive_icon_background: "#07111F"
  adaptive_icon_foreground: "assets/images/frostfit_logo.png"
